{% extends 'base.html' %}
{% block content %}
<h2 class="mb-4"><i class="bi bi-speedometer2"></i> Admin Analytics</h2>

<div class="row g-3 mb-4">
    <div class="col-6 col-md-4">
        <div class="card shadow-sm text-center h-100">
            <div class="card-body">
                <div class="fs-2 fw-bold text-primary">{{ jobs_count }}</div>
                <div class="text-muted small">Total Jobs</div>
            </div>
        </div>
    </div>
    <div class="col-6 col-md-4">
        <div class="card shadow-sm text-center h-100">
            <div class="card-body">
                <div class="fs-2 fw-bold text-info">{{ applications_count }}</div>
                <div class="text-muted small">Total Applications</div>
            </div>
        </div>
    </div>
    <div class="col-6 col-md-4">
        <div class="card shadow-sm text-center h-100">
            <div class="card-body">
                <div class="fs-2 fw-bold text-success">{{ candidates_count }}</div>
                <div class="text-muted small">Total Candidates</div>
            </div>
        </div>
    </div>
</div>

<a href="/admin/" class="btn btn-outline-secondary"><i class="bi bi-gear"></i> Go to Django Admin</a>
{% endblock %}
