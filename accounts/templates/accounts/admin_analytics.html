{% extends 'base.html' %}
{% block title %}Admin Analytics | Job Portal{% endblock %}
{% block content %}
<h2 class="mb-4"><i class="bi bi-graph-up-arrow me-2"></i>Admin Analytics</h2>
<div class="row g-3">
    <div class="col-md-4">
        <div class="card text-center shadow-sm border-0">
            <div class="card-body">
                <i class="bi bi-briefcase display-6 text-primary"></i>
                <h3 class="mt-2 mb-0">{{ jobs_count }}</h3>
                <p class="text-muted mb-0">Total Jobs</p>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card text-center shadow-sm border-0">
            <div class="card-body">
                <i class="bi bi-file-earmark-text display-6 text-success"></i>
                <h3 class="mt-2 mb-0">{{ applications_count }}</h3>
                <p class="text-muted mb-0">Total Applications</p>
            </div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card text-center shadow-sm border-0">
            <div class="card-body">
                <i class="bi bi-people display-6 text-info"></i>
                <h3 class="mt-2 mb-0">{{ candidates_count }}</h3>
                <p class="text-muted mb-0">Total Candidates</p>
            </div>
        </div>
    </div>
</div>
<p class="mt-4"><a href="/admin/" class="btn btn-outline-secondary"><i class="bi bi-gear me-1"></i>Go to Django Admin</a></p>
{% endblock %}
