{% extends 'base.html' %}
{% block title %}Edit Profile | Job Portal{% endblock %}
{% block content %}
<div class="form-card">
    <div class="card shadow-sm border-0">
        <div class="card-body">
            <h2 class="mb-4"><i class="bi bi-person-badge me-2"></i>Edit Candidate Profile</h2>
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary w-100">Save</button>
            </form>

            {% if form.instance.resume %}
                <p class="mt-3">
                    Current Resume:
                    <a href="{{ form.instance.resume.url }}" target="_blank" class="btn btn-sm btn-outline-secondary">
                        <i class="bi bi-download me-1"></i>Download
                    </a>
                </p>
            {% endif %}
        </div>
    </div>
</div>
{% endblock %}
