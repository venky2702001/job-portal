{% extends 'base.html' %}
{% block title %}Candidate Login | Job Portal{% endblock %}
{% block content %}
<div class="form-card">
    <div class="card shadow-sm border-0">
        <div class="card-body">
            <h2 class="mb-1 text-center"><i class="bi bi-box-arrow-in-right me-2"></i>Candidate Login</h2>
            <p class="text-muted text-center mb-4">Looking for a job? Sign in here.</p>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary w-100">Login</button>
            </form>
            <p class="text-center mt-3 mb-0">
                <a href="{% url 'accounts:password_reset' %}">Forgot password?</a>
            </p>
            <p class="text-center mt-3 mb-1">Don't have an account? <a href="{% url 'accounts:signup' %}">Sign up</a>
            </p>
            <p class="text-center mb-0"><small class="text-muted">Hiring instead? <a
                        href="{% url 'accounts:recruiter_login' %}">Login as a recruiter</a></small></p>
        </div>
    </div>
</div>
{% endblock %}
