{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm text-center">
            <div class="card-body p-5">
                <div class="display-4 text-success mb-3"><i class="bi bi-check-circle"></i></div>
                <h2 class="card-title">Password Reset Complete</h2>
                <p class="text-muted">Your password has been changed. You can log in now.</p>
                <a href="{% url 'accounts:login' %}" class="btn btn-primary mt-2">Log In</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
