{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm text-center">
            <div class="card-body p-5">
                <div class="display-4 text-primary mb-3"><i class="bi bi-envelope-check"></i></div>
                <h2 class="card-title">Check Your Email</h2>
                <p class="text-muted">
                    If an account exists with that email, we've sent a link to reset your password.
                    It may take a minute to arrive — check spam too.
                </p>
                <a href="{% url 'accounts:login' %}" class="btn btn-primary mt-2">Back to Login</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
