{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm text-center">
            <div class="card-body p-5">
                <div class="display-4 text-warning mb-3"><i class="bi bi-hourglass-split"></i></div>
                <h2 class="card-title">Signup Successful</h2>
                <p class="text-muted">
                    Your recruiter account has been created but is pending admin approval.
                    You'll receive an email once it's activated.
                </p>
                <a href="{% url 'accounts:login' %}" class="btn btn-primary mt-2">Back to Login</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
