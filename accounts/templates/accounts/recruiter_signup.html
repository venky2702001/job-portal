{% extends "base.html" %}
{% block title %}Recruiter Signup | Job Portal{% endblock %}
{% block content %}
<div class="form-card">
    <div class="card shadow-sm border-0">
        <div class="card-body">
            <h2 class="mb-4 text-center"><i class="bi bi-building-add me-2"></i>Recruiter Signup</h2>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary w-100">Register</button>
            </form>
            <p class="text-muted mt-3 mb-0 text-center">
                <i class="bi bi-info-circle me-1"></i>Your account will require admin approval before activation.
            </p>
        </div>
    </div>
</div>
{% endblock %}
