{% extends 'base.html' %}
{% block title %}Apply for {{ job.title }} | Job Portal{% endblock %}
{% block content %}
<div class="form-card">
    <div class="card shadow-sm border-0">
        <div class="card-body">
            <h2 class="mb-1">Apply for {{ job.title }}</h2>
            <p class="text-muted mb-4">{{ job.company }} &middot; {{ job.location }}</p>
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary w-100"><i class="bi bi-send me-1"></i>Submit Application</button>
            </form>
            <p class="mt-3 mb-0"><a href="{% url 'jobs:job_list' %}"><i class="bi bi-arrow-left me-1"></i>Back to Job List</a></p>
        </div>
    </div>
</div>
{% endblock %}
