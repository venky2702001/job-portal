{% extends 'base.html' %}
{% block content %}
<h2 class="mb-4"><i class="bi bi-bookmark-heart"></i> My Saved Jobs</h2>

<div class="card shadow-sm">
    <ul class="list-group list-group-flush">
        {% for saved_job in saved_jobs %}
            <li class="list-group-item d-flex justify-content-between align-items-center">
                <span>
                    <a class="text-decoration-none" href="{% url 'jobs:job_detail' saved_job.job.id %}">{{ saved_job.job.title }}</a>
                    <span class="text-muted small"> — {{ saved_job.job.company }}</span>
                </span>
                <a href="{% url 'applications:remove_saved_job' saved_job.job.id %}"
                   class="btn btn-sm btn-outline-danger">
                    Remove
                </a>
            </li>
        {% empty %}
            <li class="list-group-item text-muted">No saved jobs yet.</li>
        {% endfor %}
    </ul>
</div>
{% endblock %}
