{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h2 class="card-title mb-1">Update Application Status</h2>
                <p class="text-muted mb-4">
                    {{ application.candidate.username }} — {{ application.job.title }}
                </p>
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label" for="status">Select new status</label>
                        <select name="status" id="status" class="form-select">
                            {% for key, value in application.STATUS_CHOICES %}
                                <option value="{{ key }}" {% if application.status == key %}selected{% endif %}>
                                    {{ value }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary">Update</button>
                    <a href="{% url 'jobs:recruiter_dashboard' %}" class="btn btn-outline-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
