{% extends "base.html" %}
{% block title %}Update Application Status | Job Portal{% endblock %}
{% block content %}
<div class="form-card">
    <div class="card shadow-sm border-0">
        <div class="card-body">
            <h2 class="mb-1">Update Application Status</h2>
            <p class="text-muted mb-4">{{ application.candidate.username }} &mdash; {{ application.job.title }}</p>
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="status" class="form-label fw-semibold">Select new status</label>
                    <select name="status" id="status" class="form-select">
                        {% for key, value in application.STATUS_CHOICES %}
                            <option value="{{ key }}" {% if application.status == key %}selected{% endif %}>
                                {{ value }}
                            </option>
                        {% endfor %}
                    </select>
                </div>
                <button type="submit" class="btn btn-primary w-100">Update</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
