{% extends 'base.html' %}
{% block title %}Schedule Interview | Job Portal{% endblock %}
{% block content %}
<div class="form-card">
    <div class="card shadow-sm border-0">
        <div class="card-body">
            <h2 class="mb-4"><i class="bi bi-calendar-plus me-2"></i>{% if is_reschedule %}Reschedule{% else %}Schedule{% endif %} Interview</h2>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary w-100">
                    {% if is_reschedule %}Save Changes{% else %}Schedule{% endif %}
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
