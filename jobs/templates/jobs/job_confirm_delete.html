{% extends 'base.html' %}
{% block title %}Delete Job | Job Portal{% endblock %}
{% block content %}
<div class="form-card">
    <div class="card shadow-sm border-0">
        <div class="card-body text-center">
            <i class="bi bi-exclamation-triangle display-4 text-danger"></i>
            <h2 class="mt-3">Delete Job</h2>
            <p class="text-muted">Are you sure you want to delete <strong>{{ job.title }}</strong> at {{ job.company }}? This can't be undone.</p>
            <form method="post" class="d-flex justify-content-center gap-2">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">Yes, Delete</button>
                <a href="{% url 'jobs:recruiter_dashboard' %}" class="btn btn-secondary">Cancel</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
