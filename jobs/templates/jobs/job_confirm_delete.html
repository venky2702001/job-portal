{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-danger-subtle">
            <div class="card-body p-4">
                <h2 class="card-title text-danger"><i class="bi bi-exclamation-triangle"></i> Delete Job</h2>
                <p>Are you sure you want to delete <strong>{{ job.title }}</strong> at {{ job.company }}? This can't be undone.</p>
                <form method="post" class="d-flex gap-2">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger">Yes, Delete</button>
                    <a href="{% url 'jobs:recruiter_dashboard' %}" class="btn btn-outline-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
