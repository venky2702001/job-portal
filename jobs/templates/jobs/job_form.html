{% extends 'base.html' %}
{% block title %}{% if edit_mode %}Edit Job{% else %}Post a Job{% endif %} | Job Portal{% endblock %}
{% block content %}
<div class="form-card">
    <div class="card shadow-sm border-0">
        <div class="card-body">
            <h2 class="mb-4">
                <i class="bi {% if edit_mode %}bi-pencil-square{% else %}bi-plus-circle{% endif %} me-2"></i>
                {% if edit_mode %}Edit Job{% else %}Post a New Job{% endif %}
            </h2>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary w-100">
                    {% if edit_mode %}Save Changes{% else %}Create Job{% endif %}
                </button>
            </form>
            <p class="mt-3 mb-0"><a href="{% url 'jobs:job_list' %}"><i class="bi bi-arrow-left me-1"></i>Back to Job List</a></p>
        </div>
    </div>
</div>
{% endblock %}
