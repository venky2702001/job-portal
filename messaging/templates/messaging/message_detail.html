{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h2 class="card-title">{{ message.subject }}</h2>
                <p class="text-muted mb-1"><strong>From:</strong> {{ message.sender.username }}</p>
                <p class="text-muted mb-1"><strong>To:</strong> {{ message.recipient.username }}</p>
                <p class="text-muted mb-3"><strong>Sent:</strong> {{ message.timestamp }}</p>
                <hr>
                <p class="mb-4">{{ message.body|linebreaksbr }}</p>
                <a href="{% url 'messaging:inbox' %}" class="btn btn-outline-secondary">Back to Inbox</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
