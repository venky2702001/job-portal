{% extends 'base.html' %}
{% block title %}Compose Message | Job Portal{% endblock %}
{% block content %}
<div class="form-card">
    <div class="card shadow-sm border-0">
        <div class="card-body">
            <h2 class="mb-4"><i class="bi bi-pencil-square me-2"></i>Compose Message</h2>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-success w-100"><i class="bi bi-send me-1"></i>Send</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
