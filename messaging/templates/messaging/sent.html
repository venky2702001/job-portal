{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="mb-0"><i class="bi bi-envelope"></i> Sent Messages</h2>
    <a href="{% url 'messaging:send_message' %}" class="btn btn-primary"><i class="bi bi-pencil-square"></i> Compose</a>
</div>
<div class="mb-3">
    <a href="{% url 'messaging:inbox' %}" class="btn btn-sm btn-outline-secondary">Inbox</a>
    <a href="{% url 'messaging:sent_messages' %}" class="btn btn-sm btn-outline-primary">Sent</a>
</div>
<div class="card shadow-sm">
    <ul class="list-group list-group-flush">
        {% for msg in messages %}
            <li class="list-group-item d-flex justify-content-between">
                <span>{{ msg.subject }}</span>
                <span class="text-muted small">To {{ msg.recipient.username }}</span>
            </li>
        {% empty %}
            <li class="list-group-item text-muted">No sent messages.</li>
        {% endfor %}
    </ul>
</div>
{% endblock %}
