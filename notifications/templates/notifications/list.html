{% extends "base.html" %}
{% block content %}
  <h2>Notifications</h2>
  <div class="list-group">
    {% for note in notifications %}
      <a href="{% url 'notifications:mark_as_read' note.id %}"
         class="list-group-item list-group-item-action d-flex justify-content-between align-items-center {% if not note.is_read %}fw-bold{% endif %}">
        {{ note.message }}
        {% if not note.is_read %}
          <span class="badge bg-danger">New</span>
        {% endif %}
      </a>
    {% empty %}
      <div class="list-group-item">No notifications</div>
    {% endfor %}
  </div>
{% endblock %}
