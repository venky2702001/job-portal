{% extends "base.html" %}
{% block content %}
<h2 class="mb-4"><i class="bi bi-bell"></i> Notifications</h2>
<div class="card shadow-sm">
    <ul class="list-group list-group-flush">
        {% for note in notifications %}
          <li class="list-group-item d-flex justify-content-between align-items-center {% if not note.is_read %}fw-bold{% endif %}">
            {{ note.message }}
            {% if not note.is_read %}
              <span class="badge bg-danger">New</span>
            {% endif %}
          </li>
        {% empty %}
          <li class="list-group-item text-muted">No notifications</li>
        {% endfor %}
    </ul>
</div>
{% endblock %}
